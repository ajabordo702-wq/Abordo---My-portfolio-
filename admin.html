<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827"><title>Portfolio Admin | Anthony James Abordo</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-wrap{max-width:720px;margin:55px auto;padding:0 7%}.admin-panel{background:var(--panel);border:1px solid var(--line);padding:26px;border-radius:16px}
.admin-panel h1{font:800 2rem Manrope,sans-serif}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:600;font-size:.9rem}.field input,.field textarea,.field select{width:100%;padding:13px;border-radius:8px;border:1px solid var(--line);background:#0b1423;color:var(--text);font:inherit}.field textarea{min-height:100px;resize:vertical}.admin-btn{border:0;cursor:pointer;margin-top:10px}.status{margin-top:14px;color:var(--accent);overflow-wrap:anywhere}.hidden{display:none!important}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.activity-row{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.danger{background:#5a2631;color:white;border:0;border-radius:7px;padding:8px 12px}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">AJ<span>.</span></a><nav><a href="index.html">View portfolio</a></nav></header>
<main class="admin-wrap">
  <p class="eyebrow">PRIVATE AREA</p><h1>Portfolio Admin</h1>
  <p class="section-note">Sign in to upload and manage your school activities and projects.</p>
  <section class="admin-panel" id="loginPanel">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="button primary admin-btn" type="submit">Log in</button>
    </form><p class="status" id="loginStatus"></p>
  </section>
  <section class="admin-panel hidden" id="dashboard">
    <div class="admin-top"><h2>Upload an activity</h2><button class="button secondary" id="logoutBtn" type="button">Log out</button></div>
    <form id="uploadForm">
      <div class="field"><label for="title">Activity / project title</label><input id="title" maxlength="100" required placeholder="e.g. Python Activity 1"></div>
      <div class="field"><label for="category">Category</label><select id="category"><option>School Activity</option><option>Programming</option><option>Web Development</option><option>Graphic Design</option><option>Photography</option><option>Other</option></select></div>
      <div class="field"><label for="description">Description</label><textarea id="description" maxlength="600" placeholder="Briefly describe your work..."></textarea></div>
      <div class="field"><label for="file">Choose a file (image or PDF, max 10 MB)</label><input id="file" type="file" accept="image/*,application/pdf" required></div>
      <button class="button primary admin-btn" type="submit" id="uploadBtn">Upload and publish</button>
    </form><p class="status" id="uploadStatus" role="status"></p>
    <h2 style="margin-top:32px">Published activities</h2><div id="activityList"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const cfg=window.PORTFOLIO_SUPABASE||{};
const configured=cfg.url&&cfg.anonKey&&!cfg.url.includes("YOUR_PROJECT")&&!cfg.anonKey.includes("YOUR_SUPABASE");
const $=id=>document.getElementById(id);
let client=null;
if(configured) client=supabase.createClient(cfg.url,cfg.anonKey);
else $("loginStatus").textContent="Setup needed: add your Supabase Project URL and anon/publishable key in supabase-config.js.";
function showDashboard(user){$("loginPanel").classList.toggle("hidden",!!user);$("dashboard").classList.toggle("hidden",!user);if(user)loadList();}
async function loadList(){
 const {data,error}=await client.from("activities").select("*").order("created_at",{ascending:false});
 if(error){$("activityList").textContent=error.message;return;}
 $("activityList").innerHTML="";
 (data||[]).forEach(item=>{
   const row=document.createElement("div");row.className="activity-row";
   const title=document.createElement("span");title.textContent=item.title;
   const del=document.createElement("button");del.className="danger";del.textContent="Delete";
   del.onclick=async()=>{if(!confirm("Delete this activity?"))return;const {error}=await client.from("activities").delete().eq("id",item.id);if(error)alert(error.message);else loadList();};
   row.append(title,del);$("activityList").append(row);
 });
 if(!data.length)$("activityList").textContent="No activities published yet.";
}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!client)return;
 $("loginStatus").textContent="Signing in...";
 const {data,error}=await client.auth.signInWithPassword({email:$("email").value,password:$("password").value});
 $("loginStatus").textContent=error?error.message:"";
 if(data.user)showDashboard(data.user);
});
$("logoutBtn").onclick=async()=>{await client.auth.signOut();showDashboard(null);};
$("uploadForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!client)return;
 const file=$("file").files[0];if(!file)return;
 if(file.size>10*1024*1024){$("uploadStatus").textContent="File is larger than 10 MB. Please choose a smaller file.";return;}
 const btn=$("uploadBtn");btn.disabled=true;$("uploadStatus").textContent="Uploading...";
 try{
   const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"-");
   const path=`${Date.now()}-${crypto.randomUUID()}-${safeName}`;
   const {data:stored,error:storageError}=await client.storage.from("portfolio-activities").upload(path,file,{upsert:false,contentType:file.type});
   if(storageError)throw storageError;
   const {data:publicData}=client.storage.from("portfolio-activities").getPublicUrl(stored.path);
   const {error:dbError}=await client.from("activities").insert({title:$("title").value.trim(),category:$("category").value,description:$("description").value.trim(),file_url:publicData.publicUrl,file_path:stored.path,file_type:file.type});
   if(dbError){await client.storage.from("portfolio-activities").remove([stored.path]);throw dbError;}
   $("uploadStatus").textContent="Published! Your activity is now on your portfolio.";
   $("uploadForm").reset();await loadList();
 }catch(err){$("uploadStatus").textContent="Upload failed: "+err.message;}
 finally{btn.disabled=false;}
});
if(client){client.auth.getSession().then(({data})=>showDashboard(data.session?.user||null));}
</script>
</body></html>
